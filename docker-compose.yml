version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinica_psico_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      # Conexão padrão do Supabase (lida do backend/.env)
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:[YOUR-PASSWORD]@db.[YOUR-PROJECT-REF].supabase.co:5432/postgres}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@clinicapsico.com.br}
      SECRET_KEY: ${SECRET_KEY:-clinica_psico_chave_secreta_jwt_producao_2026_super_segura}
      FRONTEND_ORIGINS: http://localhost:5173,http://localhost,http://127.0.0.1
    ports:
      - "8000:8000"
    networks:
      - clinica_network

  frontend:
    build:
      context: ./frontend/Clinica-PSICO-React
      dockerfile: Dockerfile
    container_name: clinica_psico_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - clinica_network

networks:
  clinica_network:
    driver: bridge
