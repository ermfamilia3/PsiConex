services:
  # ============================================================================
  # 1. BACKEND API (Python / FastAPI)
  # ============================================================================
  - type: web
    name: psiconex-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@clinicapsico.com.br
      - key: FRONTEND_ORIGINS
        value: https://psiconex-frontend.onrender.com,http://localhost:5173,http://localhost:3000
      - key: DB_SSLMODE
        value: require

  # ============================================================================
  # 2. FRONTEND (React / Vite)
  # ============================================================================
  - type: web
    name: psiconex-frontend
    runtime: static
    rootDir: frontend/Clinica-PSICO-React
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: psiconex-backend
          property: host
